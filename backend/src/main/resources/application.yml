spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:weiboblog}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:weiboblog}
    password: ${MYSQL_PASSWORD:weiboblog}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-secret-value}
    expiration: 86400000

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
