spring:
  datasource:
    url: jdbc:mysql://localhost:3306/weiboblog?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC
    username: ${MYSQL_USER:weiboblog}
    password: ${MYSQL_PASSWORD:weiboblog}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-secret-value}
    expiration: 86400000
  aliyun:
    oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
      domain: ${ALIYUN_OSS_DOMAIN:}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
